name: Release unsigned DMG

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  unsigned-dmg:
    name: Build and publish unsigned DMG
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if [[ ! "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-+][A-Za-z0-9._-]+)?$ ]]; then
            echo "Tag must look like v0.1.0 or v0.1.0-beta.1"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare unsigned release artifacts
        run: scripts/prepare-unsigned-release.sh "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Baseline-${VERSION}-unsigned.dmg" \
            "dist/Baseline-${VERSION}-unsigned.dmg.sha256" \
            --title "Baseline ${VERSION} unsigned preview" \
            --notes-file "dist/Baseline-${VERSION}-unsigned-release-notes.md"

      - name: Dispatch Homebrew tap update
        env:
          GH_TOKEN: ${{ secrets.TAP_WORKFLOW_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::TAP_WORKFLOW_TOKEN is not configured; skipping Homebrew tap update."
            exit 0
          fi

          gh workflow run update-baseline-cask.yml \
            --repo arshiaghaf/homebrew-tap \
            --ref main \
            -f tag="$GITHUB_REF_NAME" \
            -f repository="$GITHUB_REPOSITORY"
