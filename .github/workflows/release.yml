name: Release unsigned DMG

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  unsigned-dmg:
    name: Build and publish unsigned DMG
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)[.](0|[1-9][0-9]?)[.](0|[1-9][0-9]?)$ ]]; then
            echo "Tag must look like v0.1.0 with minor and patch below 100"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare unsigned release artifacts
        env:
          BASELINE_RELEASE_BUILD: "1"
        run: scripts/prepare-unsigned-release.sh "${{ steps.version.outputs.version }}"

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Baseline-${{ steps.version.outputs.version }}-unsigned-release
          path: |
            dist/Baseline-${{ steps.version.outputs.version }}-unsigned.dmg
            dist/Baseline-${{ steps.version.outputs.version }}-unsigned.dmg.sha256
            dist/Baseline-${{ steps.version.outputs.version }}-unsigned-release-notes.md
