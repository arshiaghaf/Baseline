name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, macos-26, macos-26-intel, macos-15, macos-15-intel]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Runner info
        run: |
          sw_vers
          uname -a
          uname -m
          xcode-select -p
          xcodebuild -version
          if [[ "${{ matrix.os }}" == "xcode-27" ]]; then
            [[ "$(sw_vers -productVersion)" == 27.* ]]
            [[ "$(uname -m)" == "arm64" ]]
          fi
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint shell scripts
        run: |
          bash -n scripts/create-unsigned-dmg.sh
          bash -n scripts/check-release-assets.sh
          bash -n scripts/prepare-unsigned-release.sh
          bash -n scripts/validate-preview.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Run unit tests
        run: npm test

      - name: Package Electron app
        run: npm run build

      - name: Electron smoke test
        id: electron-smoke
        run: npm run test:electron

      - name: Electron visual comparison (macOS 27 Apple Silicon)
        if: matrix.os == 'xcode-27'
        env:
          BASELINE_VISUAL_LANE: xcode-27
        run: npx playwright test --config playwright.visual.config.ts --output test-results/normal-comparison

      # Temporary artifact-only original-source capture; remove before acceptance.
      # The normal comparison above remains independently red for missing originals.
      - name: Capture PR 288 original CI pixels and compare twice
        if: always() && matrix.os == 'xcode-27' && github.event.pull_request.number == 288 && steps.electron-smoke.outcome == 'success'
        env:
          BASELINE_VISUAL_LANE: xcode-27
        run: |
          set -euo pipefail
          git fetch --no-tags origin a3292e0b3a5b0735b681eb5f9568023ecbcb9ac2
          mkdir -p ci-original-evidence
          npx playwright test --config playwright.visual.capture.config.ts --update-snapshots --output test-results/original-capture 2>&1 | tee ci-original-evidence/capture.log
          shasum -a 256 ci-original-capture/xcode-27-macos-27-arm64-software-srgb/*.png > ci-original-evidence/original-png-sha256.txt
          npx playwright test --config playwright.visual.capture.config.ts --output test-results/original-repeat-1 2>&1 | tee ci-original-evidence/repeat-1.log
          shasum -a 256 -c ci-original-evidence/original-png-sha256.txt > ci-original-evidence/repeat-1-png-integrity.log
          npx playwright test --config playwright.visual.capture.config.ts --output test-results/original-repeat-2 2>&1 | tee ci-original-evidence/repeat-2.log
          shasum -a 256 -c ci-original-evidence/original-png-sha256.txt > ci-original-evidence/repeat-2-png-integrity.log

      - name: Retain visual comparison evidence
        if: always() && matrix.os == 'xcode-27'
        uses: actions/upload-artifact@v7
        with:
          name: electron-visual-results
          path: |
            test-results/
            ci-original-capture/
            ci-original-evidence/
          retention-days: 7

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
