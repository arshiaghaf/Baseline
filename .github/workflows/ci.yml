name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, macos-26, macos-15]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Runner info
        run: |
          sw_vers
          uname -a
          [[ "$(uname -m)" == "arm64" ]]
          xcode-select -p
          xcodebuild -version
          if [[ "${{ matrix.os }}" == "xcode-27" ]]; then
            [[ "$(sw_vers -productVersion)" == 27.* ]]
            [[ "$(uname -m)" == "arm64" ]]
          fi
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Prepare Electron runtime before parallel tests
        run: node -e 'require("electron")'

      - name: Prepare pinned upstream Sparkle for native guard tests
        run: npm run prepare:sparkle

      - name: Lint shell scripts
        run: |
          bash -n scripts/baseline
          bash -n scripts/create-unsigned-dmg.sh
          bash -n scripts/check-release-assets.sh
          bash -n scripts/prepare-unsigned-release.sh
          bash -n scripts/prepare-signed-updates.sh
          bash -n scripts/validate-preview.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Run unit tests
        run: npm test

      - name: Package Electron app
        run: npm run build

      - name: Authenticated isolated updater lifecycle and rejection checks
        env:
          BASELINE_SELF_UPDATE_FIXTURE_TESTS: "1"
        run: npm test -- ElectronTests/selfUpdateLifecycle.test.ts

      - name: Verify Apple Silicon package architecture and icons
        run: |
          app="out/Baseline-darwin-arm64/Baseline.app"
          for binary in "$app/Contents/MacOS/Baseline" "$app/Contents/Frameworks/Electron Framework.framework/Electron Framework" "$app/Contents/Resources/admin-askpass"; do
            [[ "$(lipo -archs "$binary")" == "arm64" ]]
          done
          icon_file="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")"
          [[ -s "$app/Contents/Resources/$icon_file" ]]
          if [[ "$(sw_vers -productVersion | cut -d. -f1)" -ge 26 ]]; then
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Contents/Info.plist")" == "Icon" ]]
            [[ -s "$app/Contents/Resources/Assets.car" ]]
            /usr/bin/assetutil --info "$app/Contents/Resources/Assets.car" > "$RUNNER_TEMP/baseline-icon-catalog.json"
            node - "$RUNNER_TEMP/baseline-icon-catalog.json" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const catalog = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const appearances = new Set(catalog
            .filter(asset => asset.AssetType === 'IconImageStack' && asset.Name === 'Icon')
            .map(asset => asset.Appearance));
          for (const appearance of ['NSAppearanceNameAqua', 'NSAppearanceNameDarkAqua', 'ISAppearanceTintable']) {
            assert(appearances.has(appearance), `Missing icon appearance: ${appearance}`);
          }
          NODE
          fi

      - name: Focused Electron lifecycle checks
        if: matrix.os == 'macos-26'
        run: npm run test:electron -- --grep "keeps hidden-Dock settings reachable|narrow operation notice wraps" --output=test-results/lifecycle-focused

      - name: Electron smoke test
        run: npm run test:electron -- --output=test-results/full

      - name: Retain focused lifecycle diagnostics
        if: always() && matrix.os == 'macos-26'
        uses: actions/upload-artifact@v7
        with:
          name: electron-lifecycle-${{ matrix.os }}-${{ github.run_attempt }}
          path: test-results/lifecycle-focused/**/electron-lifecycle-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain Electron failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: electron-failure-${{ matrix.os }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify drag-to-Applications DMG
        run: |
          arch="$(node -p 'process.arch')"
          node scripts/package-dmg.mjs "out/Baseline-darwin-${arch}/Baseline.app" dist/Baseline-ci.dmg "Baseline CI"
          hdiutil verify dist/Baseline-ci.dmg
          mount_path="$(mktemp -d)"
          trap 'hdiutil detach "$mount_path" || true; rmdir "$mount_path"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_path" dist/Baseline-ci.dmg
          [[ "$(readlink "$mount_path/Applications")" == "/Applications" ]]
          [[ -f "$mount_path/.DS_Store" && -f "$mount_path/.background/background.tiff" ]]
          codesign --verify --deep --strict "$mount_path/Baseline.app"

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
